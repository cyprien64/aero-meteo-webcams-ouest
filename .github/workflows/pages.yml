name: Collecte météo / NOTAM / SUP AIP et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendance (lecture des cartes VAC)
        run: python3 -m pip install --quiet pypdf

      - name: Collecte METAR/TAF, NOTAM (SOFIA), SUP AIP, zones et VAC (SIA)
        env:
          FALLBACK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/collect.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
