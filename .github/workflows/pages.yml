name: Collecte météo / NOTAM / SUP AIP et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "4,19,34,49 * * * *"
    - cron: "7 3 * * *"            # une fois par jour : contrôle keepalive   # toutes les 15 min, hors des minutes 00/30 très chargées chez GitHub (qui peut sauter des créneaux)
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # bloque la publication si un script du site ne se charge plus ou si un console.assert échoue (le site en ligne reste tel quel)
      - name: Test de chargement du site
        run: node tests/test_site.js

      - name: Dépendance (lecture des cartes VAC)
        run: python3 -m pip install --quiet pypdf

      # VAC en PDF (≈ 70 Mo) : téléchargées une fois par cycle AIRAC puis gardées dans le cache GitHub
      - name: Cycle AIRAC en vigueur
        id: cyc
        run: echo "c=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import collect; print(collect.current_cycle()[1])' 2>/dev/null || echo inconnu)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: data/vac
          # la liste des terrains fait partie de la clé : quand elle change, le cache est réenregistré avec les nouvelles VAC
          key: vac-pdf-${{ steps.cyc.outputs.c }}-${{ hashFiles('data/sources.js') }}
          restore-keys: |
            vac-pdf-${{ steps.cyc.outputs.c }}-
            vac-pdf-

      - name: Collecte METAR/TAF, NOTAM (SOFIA), SUP AIP, zones, VAC (SIA) et contrôle des webcams
        timeout-minutes: 30   # la collecte tourne toutes les 15 min : au-delà, la publication suivante prend le relais
        env:
          FALLBACK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -u scripts/collect.py   # -u : journal au fil de l'eau (durée de chaque partie visible)

      - uses: actions/configure-pages@v6

      # Seuls les fichiers du site sont publiés (pas les scripts, la doc ni le README), plus une archive pour l'extension Chrome
      - name: Préparation des fichiers publiés
        run: |
          mkdir _site
          cp -r index.html map.html *.js *.css *.json app.webmanifest icons lib data _site/
          (cd _site && zip -qr ../site.zip . -x 'data/vac/*') && mv site.zip _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true   # raté passager de GitHub : nouvel essai ci-dessous

      - name: Nouvel essai de mise en ligne (après 30 s)
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Échoue si NOTAM / METAR ne se mettent plus à jour -> GitHub envoie un e-mail d'échec
      - name: Contrôle de fraîcheur des données
        run: python3 scripts/health.py

  # GitHub suspend les tâches planifiées d'un dépôt public sans activité depuis 60 jours :
  # un commit vide est poussé si le dernier commit date de plus de 45 jours.
  keepalive:
    if: github.event.schedule == '7 3 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit de maintien si nécessaire
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Maintien de la collecte automatique (keepalive)"
            git push
          else
            echo "Dernier commit récent : rien à faire."
          fi
